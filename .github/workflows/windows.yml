name: windows

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: >-
      ${{matrix.platform}} ${{matrix.toolset}} c++${{matrix.standard}}
      ${{matrix.build_type}} ${{matrix.shared && 'Shared' || ''}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        # windows-2022 has MSVC 2022 installed:
        # https://github.com/actions/virtual-environments.
        os: [windows-2022]
        platform: [Win32, x64]
        toolset: [v142]
        standard: [14, 17, 20]
        shared: ["", -DBUILD_SHARED_LIBS=ON]
        build_type: [Debug, Release]
        exclude:
          - { toolset: v142, standard: 14 }
          - { platform: Win32, standard: 14 }
          - { platform: Win32, standard: 20 }
          - { platform: x64, standard: 14, shared: -DBUILD_SHARED_LIBS=ON }
          - { platform: x64, standard: 20, shared: -DBUILD_SHARED_LIBS=ON }
        include:
          - os: windows-2022
            platform: x64
            toolset: v143
            build_type: Debug
            standard: 20

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set timezone
      run: tzutil /s "FLE Standard Time"

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure
      # Use a bash shell for $GITHUB_WORKSPACE.
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: |
        cmake -A ${{matrix.platform}} -T ${{matrix.toolset}} \
              -DCMAKE_CXX_STANDARD=${{matrix.standard}} \
              ${{matrix.shared}} -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
              $GITHUB_WORKSPACE

    - name: Build
      working-directory: ${{runner.workspace}}/build
      run: |
        $threads = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
        cmake --build . --config ${{matrix.build_type}} --parallel $threads

    - name: Test
      working-directory: ${{runner.workspace}}/build
      run: ctest -C ${{matrix.build_type}} -V
      env:
        CTEST_OUTPUT_ON_FAILURE: True

  shared-module:
    name: x64 v143 shared module install
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Test the installed shared module
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
        Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"

        $prefix = "$PWD/build/shared-module/install"
        $fmt = "build/shared-module/fmt"
        $test = "build/shared-module/test"
        $options = @("-G", "Ninja", "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_CXX_STANDARD=20")
        cmake -S . -B $fmt @options -DBUILD_SHARED_LIBS=ON -DFMT_MODULE=ON -DFMT_TEST=OFF "-DCMAKE_INSTALL_PREFIX=$prefix"
        cmake --build $fmt --target install
        cmake -S test/installed-module-test -B $test @options "-DCMAKE_PREFIX_PATH=$prefix" "-DFMT_BINARY_DIR:PATH=$PWD/$fmt"
        cmake --build $test
        $env:PATH = "$prefix/bin;$env:PATH"
        & "./$test/module-test.exe"

  mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      matrix:
        sys: [ mingw64, ucrt64 ]
    steps:
    - name: Set timezone
      run: tzutil /s "FLE Standard Time"
      shell: cmd
    - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        release: false
        msystem: ${{matrix.sys}}
        pacboy: cc:p cmake:p ninja:p lld:p
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Configure
      run: cmake -B ../build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Debug
      env: { LDFLAGS: -fuse-ld=lld }
    - name: Build
      run: cmake --build ../build
    - name: Test
      run: ctest -j `nproc` --test-dir ../build
      env:
        CTEST_OUTPUT_ON_FAILURE: True
